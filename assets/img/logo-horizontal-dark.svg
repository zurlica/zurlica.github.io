<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 128" role="img" aria-labelledby="zurlHorizontalDarkTitle zurlHorizontalDarkDesc">
  <title id="zurlHorizontalDarkTitle">ZURLICA horizontal dark logo</title>
  <desc id="zurlHorizontalDarkDesc">Horizontal dark-background academic logo for Zanzibar University Research Lab for Intelligent Computing and Analytics.</desc>

  <defs>
    <linearGradient id="zurlHorizontalDarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54C77B" />
      <stop offset="100%" stop-color="#4DD8D8" />
    </linearGradient>

    <g id="zurlHorizontalDarkMark">
      <!-- Academic shield -->
      <path
        d="M64 5 L110 23 V60 C110 83 92 103 64 123 C36 103 18 83 18 60 V23 Z"
        fill="#0B2D4E"
        stroke="#F7F8F2"
        stroke-width="4"
        stroke-linejoin="round"
      />

      <!-- Inner institutional crest line -->
      <path
        d="M64 14 L101 29 V60 C101 79 86 95 64 110 C42 95 27 79 27 60 V29 Z"
        fill="none"
        stroke="#D9E8DD"
        stroke-width="1.25"
        stroke-linejoin="round"
        opacity="0.30"
      />

      <!-- Scientific globe / research network -->
      <g fill="none" stroke="#DDEBE1" stroke-width="1.45" opacity="0.46">
        <circle cx="64" cy="55" r="27" />
        <ellipse cx="64" cy="55" rx="12.5" ry="27" />
        <path d="M37 55 H91" />
        <path d="M41 42 C54 48 74 48 87 42" />
        <path d="M41 68 C54 62 74 62 87 68" />
        <path d="M64 28 V82" />
      </g>

      <!-- Neural Z / intelligent computing path -->
      <path
        d="M45 42 H83 L45 69 H83"
        fill="none"
        stroke="url(#zurlHorizontalDarkGradient)"
        stroke-width="7.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Central intelligence node -->
      <circle cx="64" cy="55.5" r="2.4" fill="#FFFDF0" />

      <!-- Research/data nodes -->
      <circle cx="45" cy="42" r="4.15" fill="#54C77B" stroke="#0B2D4E" stroke-width="0.8" />
      <circle cx="83" cy="42" r="4.15" fill="#4DD8D8" stroke="#0B2D4E" stroke-width="0.8" />
      <circle cx="45" cy="69" r="4.15" fill="#4DD8D8" stroke="#0B2D4E" stroke-width="0.8" />
      <circle cx="83" cy="69" r="4.15" fill="#F2C94C" stroke="#0B2D4E" stroke-width="0.8" />

      <!-- Analytics / business intelligence bars -->
      <g>
        <rect x="48.5" y="89.5" width="6.2" height="7" rx="1.8" fill="#F2C94C" />
        <rect x="60.9" y="85.5" width="6.2" height="11" rx="1.8" fill="#54C77B" />
        <rect x="73.3" y="81.5" width="6.2" height="15" rx="1.8" fill="#4DD8D8" />
        <path
          d="M47 97.5 H81.5"
          fill="none"
          stroke="#F7F8F2"
          stroke-width="1.2"
          stroke-linecap="round"
          opacity="0.18"
        />
      </g>
    </g>
  </defs>

  <use href="#zurlHorizontalDarkMark" x="4" y="0" />

  <g font-family="Inter, Aptos, 'Segoe UI', Arial, sans-serif" text-rendering="geometricPrecision">
    <text
      x="158"
      y="32"
      font-size="12.5"
      font-weight="700"
      letter-spacing="2.4"
      fill="#D1E5D7"
    >ZANZIBAR UNIVERSITY</text>

    <text
      x="154"
      y="78"
      font-size="44"
      font-weight="800"
      letter-spacing="0"
      fill="#FFFFFF"
    >ZURLICA</text>

    <text
      x="157"
      y="104"
      font-size="15.2"
      font-weight="600"
      letter-spacing="0.15"
      fill="#E6F2E8"
    >Research Lab for Intelligent Computing and Analytics</text>

    <path
      d="M158 115 H548"
      fill="none"
      stroke="#54C77B"
      stroke-width="2.4"
      stroke-linecap="round"
    />

    <circle cx="556" cy="115" r="2.5" fill="#4DD8D8" />
  </g>
</svg>
